<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="facebook-domain-verification" content="7y0oo62k0e9k4s5uzaxm2uhpm4p4as" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3A4D83" />
    <title>Comment</title>
    <meta
      name="description"
      content="كل تعليق ورسالة من Instagram و Facebook و TikTok و X في صندوق واحد، مصنّفة لك تلقائيًا."
    />
  </head>
  <body>
    <script>
      // Applies the stored language before first paint. Without this, a
      // returning English visitor sees one RTL frame before React mounts.
      // The key must match LOCALE_STORAGE_KEY in src/i18n/locale.ts.
      try {
        var stored = localStorage.getItem('comment.locale')
        if (stored === 'en' || stored === 'ar') {
          document.documentElement.lang = stored
          document.documentElement.dir = stored === 'en' ? 'ltr' : 'rtl'
        }
      } catch (error) {
        // Storage blocked — the Arabic default in <html> already applies.
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
